[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]
# Vendored code (ADR 0021) is not ours to format, lint or test.
exclude = ["third_party"]

[workspace.package]
version = "0.3.0-beta.1"
edition = "2024"
# gtk4 0.11 / libadwaita 0.9 / gio 0.22 require Rust 1.92.
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/rsmirke/rappel"
publish = false

[workspace.dependencies]
rappel-core = { path = "crates/core" }

# UI (app crate only; never in rappel-core).
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
# The card editor (SPEC §4.4, ADR 0022): GtkSourceView 5 bindings, same
# gtk-rs release as gtk4 0.11. v5_10 for the built-in Adwaita style schemes.
sourceview5 = { version = "0.11", features = ["v5_10"] }
# Card text rendering (app): grapheme cluster boundaries, so the breaks that
# keep long runs fast to lay out never split a character (ADR 0025).
unicode-segmentation = "1.13"

# Images (app, ADR 0055): decodes card images in a sandboxed process
# (bubblewrap + seccomp, the GNOME image loaders), off the main thread, and
# gives a GdkTexture. 3.1 is the newest release for our Rust 1.92 floor
# (4.x needs 1.93) and talks to the loaders the distributions ship
# (glycin-loaders 2.x). MPL-2.0 OR LGPL-2.1-or-later.
glycin = { version = "3.1", features = ["gdk4"] }

# Translation (app, ADR 0059): safe bindings to the C library's gettext
# (`bindtextdomain`, `textdomain`, `gettext`, `ngettext`, `pgettext`). The
# `gettext-system` feature links glibc's libintl instead of building GNU
# gettext from the bundled sources. MIT.
gettext-rs = { version = "0.8", features = ["gettext-system"] }

# Window state (app): the O_NOFOLLOW and O_NONBLOCK flags for opening an
# untrusted file without following a link or blocking on a pipe (ADR 0050,
# row 33). Constants only; already in the tree through GLib's bindings.
libc = "0.2"

# Errors (rappel-core).
thiserror = "2"

# Storage (rappel-core). Bundled SQLite: same version everywhere, FTS5 included.
# `collation` and `limits` (ADR 0061): an Anki collection's schema names a
# `unicase` collation, which its tables cannot be read without, and an
# untrusted collection is read with lowered length limits. `hooks` (ADR 0063):
# the progress handler that stops a long statement of a cancelled Anki import.
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "backup", "collation", "hooks", "limits"] }

# Scheduling (rappel-core): the reference FSRS implementation (ADR 0006).
fsrs = "6.6"

# Ids (rappel-core): random bits for UUIDv7 (ADR 0008). Already in the tree
# through fsrs -> rand.
getrandom = "0.4"

# Deck name keys (rappel-core): Unicode NFC, which std does not provide
# (ADR 0010).
unicode-normalization = "0.1"

# Export / import (rappel-core, ADR 0017): the `.rappel` zip archive. Only
# Deflate through zlib-rs (pure Rust); no encryption, no other codecs.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Export / import (rappel-core): the `cards.json` format.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Import (rappel-core, ADR 0053): the archive is read by our own code, not
# the zip crate's reader, which keeps every central record and retries
# earlier end records; Deflate through flate2 (zlib-rs, pure Rust) and the
# CRC through crc32fast, both already in the tree through `zip`.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
crc32fast = "1.5"
# Export / import (rappel-core, ADR 0053): SHA-256 of `cards.json` while it
# streams, so `apply_import` knows the file is the one `plan_import` checked;
# the media store (SPEC §4.3) names files by it. Already in the tree through
# rust-embed (the app's KaTeX fonts). No default features: no OIDs needed.
sha2 = { version = "0.11", default-features = false }

# Anki import (rappel-core, ADR 0061): the current Anki package format
# compresses its collection and media files with zstd. A pure-Rust decoder
# (no C library on the path of an untrusted file), read as a stream whose
# window is capped, so a zstd bomb stops at our own cap. MIT.
ruzstd = "0.9"

# Card content (rappel-core, ADR 0019): CommonMark parser with tables,
# strikethrough and math. No default features: they only add a CLI.
pulldown-cmark = { version = "0.13", default-features = false }

# Math (rappel app, ADR 0021): RaTeX parses and lays out LaTeX; the vendored
# ratex-cairo (see [patch.crates-io]) draws it with cairo. rappel-core uses
# ratex-parser alone (no UI) to check that a formula from Anki is one Rappel
# can draw before it becomes math (ADR 0061). Pinned: young
# project, review FONT_NOTICE.txt of ratex-katex-fonts at every bump.
ratex-cairo = "=0.1.15"
ratex-parser = "=0.1.15"
ratex-layout = "=0.1.15"
ratex-types = "=0.1.15"

# Test-only: temporary directories for filesystem tests.
tempfile = "3"
# Test-only: property-based tests (scheduler replay).
proptest = "1"

# Logging.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ratex-cairo 0.1.15 with cairo-rs bumped to 0.22 (third_party/ratex-cairo/VENDORED.md).
# A path, not git: deny.toml has allow-git = [].
[patch.crates-io]
ratex-cairo = { path = "third_party/ratex-cairo" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Tests may unwrap/expect (see clippy.toml). Elsewhere, `expect()` is only for
# template children and invariants, with an `#[expect(.., reason = "..")]`.
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
# A lint is silenced only with `#[expect(.., reason = "..")]`: the reason is
# required, and the build fails once the lint no longer fires.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
lto = "thin"
# Never set `panic = "abort"` (here or in any profile): the app catches
# panics inside RaTeX so that one hostile formula cannot close the window
# (ADR 0023). `crates/app/src/main.rs` refuses to build with it.

# SHA-256 runs over every byte an import reads (ADR 0053); unoptimized it
# is many times slower, which the debug app and the tests would feel.
[profile.dev.package.sha2]
opt-level = 3

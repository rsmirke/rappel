[package]
name = "rappel"
description = "Rappel: a native GNOME flashcard app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rappel-core.workspace = true
gtk.workspace = true
adw.workspace = true
sourceview5.workspace = true
ratex-cairo.workspace = true
ratex-parser.workspace = true
ratex-layout.workspace = true
ratex-types.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-segmentation.workspace = true
libc.workspace = true
glycin.workspace = true
gettext-rs.workspace = true

[dev-dependencies]
proptest.workspace = true
# Only to write a damaged settings value in tests, as a hand edit would:
# the app itself never reaches SQL (ADR 0052).
rusqlite.workspace = true
tempfile.workspace = true
# Only to write hostile images by hand in tests (a PNG header claiming a
# huge size, a decompression bomb): its chunks' CRCs and zlib data.
crc32fast.workspace = true
flate2.workspace = true

[lints]
workspace = true

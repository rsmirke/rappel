# cargo-deny configuration. Run with `cargo deny check` (part of scripts/check.sh).
# Rappel is GPL-3.0-or-later: every dependency licence must be compatible with it.

[graph]
all-features = true

[advisories]
# Fail on any vulnerability, unmaintained or unsound advisory in the RustSec DB.
version = 2
yanked = "deny"
# RUSTSEC-2026-0192 (ADR 0021): `ttf-parser` is unmaintained. Not a
# vulnerability, and there is no fixed version. It reaches us through RaTeX
# (ab_glyph, fontdb), parses only the bundled KaTeX fonts and installed system
# fonts, and is never given card content as a font.
# REVIEW BY 2027-01-16 (cargo-deny has no expiry field). Review sooner when
# RaTeX, ab_glyph or fontdb update, and remove the entry once RaTeX moves
# to `skrifa`.
#
# RUSTSEC-2024-0436 (`paste`), RUSTSEC-2026-0371 (`zbus_names`) and the
# `zvariant` / `zvariant_derive` notices of the same announcement (ADR 0055):
# unmaintained, not vulnerable, with no fixed version. They reach us only
# through glycin (the image decoder): `paste` is a build-time macro of
# glycin-common and gufo-common. The z* crates are zbus 5's D-Bus types,
# merged into zbus 6; glycin talks to its loader process over a private
# socket with them (never the session or system bus), so **zvariant parses
# the replies of the loader, which a hostile image may have taken over: it
# sits on the sandbox boundary, inside Rappel's process**. Not a known flaw,
# but the reason to keep watching. REVIEW ON EVERY GLYCIN RELEASE (and by
# 2027-01-16 at the latest); remove them when glycin moves to zbus 6 and off
# `paste` (glycin 4.0.3 still has the same tree). The maintainer is asked
# to confirm them in docs/briefs/QUESTIONS.md.
ignore = [
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained, not vulnerable; it parses only the bundled KaTeX fonts and installed system fonts. Review by 2027-01-16 (ADR 0021)." },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, not vulnerable; a build-time macro of glycin's crates. Review on every glycin release, by 2027-01-16 at the latest (ADR 0055)." },
    { id = "RUSTSEC-2026-0370", reason = "zvariant is unmaintained (merged into zbus 6), not vulnerable; it parses the replies of glycin's loader process, so it sits on the sandbox boundary. Review on every glycin release, by 2027-01-16 at the latest; remove when glycin moves to zbus 6 (ADR 0055)." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names is unmaintained (merged into zbus 6), not vulnerable; through glycin only. Review on every glycin release, by 2027-01-16 at the latest; remove when glycin moves to zbus 6 (ADR 0055)." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is unmaintained (merged into zbus 6), not vulnerable; through glycin only. Review on every glycin release, by 2027-01-16 at the latest; remove when glycin moves to zbus 6 (ADR 0055)." },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The allow-list is a policy, not an inventory: entries no crate uses yet are fine.
unused-allowed-license = "allow"
# Only licences that can be combined into a GPL-3.0-or-later program.
# Add to this list only after checking GPL-3.0 compatibility (FSF list).
allow = [
    "GPL-3.0-or-later",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "MPL-2.0",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
]

# `ratex-katex-fonts` is labelled MIT, but its 20 embedded `KaTeX_*.ttf` are
# SIL OFL-1.1 (fonts/OFL.txt, fonts/FONT_NOTICE.txt). The fonts are data
# aggregated with the program, not code combined with it, so OFL-1.1 is
# allowed for this crate only, never globally (ADR 0021, point 8). The
# clarification records the real expression and pins it to the hash of
# OFL.txt, so a changed licence file fails the check. Every `ratex-*` bump
# also needs a manual read of fonts/FONT_NOTICE.txt: a release could add
# fonts under another licence and keep OFL.txt.
[[licenses.exceptions]]
crate = "ratex-katex-fonts"
allow = ["OFL-1.1"]

[[licenses.clarify]]
crate = "ratex-katex-fonts"
expression = "MIT AND OFL-1.1"
license-files = [{ path = "fonts/OFL.txt", hash = 0x55ee1b8a }]

[licenses.private]
# Our own crates are `publish = false`; their licence is checked by the list above.
ignore = false

[bans]
# Duplicate versions are reported but allowed (common in the gtk-rs tree).
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside this workspace have no version requirement.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

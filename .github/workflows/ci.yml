# Runs the quality gate (scripts/check.sh) exactly as developers run it locally.
# See docs/adr/0003-ci-github-actions.md for the reasoning behind this setup.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs of a PR; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id is the status check name: mark `check` as required in the ruleset.
  check:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        # Explicit bash makes GitHub add `-o pipefail`, so `curl | sh` fails loudly.
        shell: bash
    steps:
      - name: Install system packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          # First line: build dependencies from README.md.
          # Second line: what the bare container lacks for checkout, rustup,
          # install-action (jq) and linking.
          # Third line: an X server for the tests that need GTK (ADR 0024).
          # Fourth line: the image decoder glycin, its build dependencies,
          # its loaders and its sandbox, for the image tests (ADR 0055;
          # where bubblewrap cannot make namespaces, as in an unprivileged
          # container, glycin runs its loaders unsandboxed by design).
          # Fifth line: GStreamer's base and good plugins, so the audio
          # tests play through GTK's media stream for real (ADR 0056);
          # without playbin3 Rappel plays nothing, by its own check.
          # Sixth line: the C library's locale sources, from which a test
          # makes a French locale with localedef to read the French
          # catalog through gettext itself (ADR 0059).
          # Seventh line: the validators of the desktop integration drafts
          # in data/, which the tests run (ADR 0060).
          apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libgtksourceview-5-dev gir1.2-gtksource-5 \
            blueprint-compiler libglib2.0-dev-bin \
            git ca-certificates curl jq build-essential pkg-config \
            xvfb xauth \
            liblcms2-dev libseccomp-dev libfontconfig-dev glycin-loaders bubblewrap \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            locales \
            appstream desktop-file-utils

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes; do not leave the token in .git/config.
          persist-credentials: false

      # The container runs as root but the checkout belongs to the runner user;
      # without this, `git rev-parse` in check.sh fails with "dubious ownership".
      - name: Mark workspace as a safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Must come before rust-cache, which runs rustc/cargo to compute its cache key.
      - name: Install Rust (stable)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --component rustfmt,clippy --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny
          # Only the checksum-verified prebuilt binary; never build from source.
          fallback: none

      # Some tests start GTK, which needs a display; Xvfb is one without a screen.
      - name: Quality gate
        run: xvfb-run -a scripts/check.sh
